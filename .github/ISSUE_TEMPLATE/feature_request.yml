name: Feature request
description: Suggest an idea, such as another provider or a display option
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the widget to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help you?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [macOS, Windows]
